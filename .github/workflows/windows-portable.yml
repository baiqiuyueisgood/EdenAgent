name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      HUSKY: '0'
      EDEN_AGENT_AUTH_MODE: development

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            frontend/desktop/native/win32-pointer-observer -> target

      # 只装根依赖：frontend 的 workspace 会被提升到根 node_modules。
      # 不要用 npm --prefix frontend ci，会因 @eden/api@* 私有工作区包 404。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate browser protocol
        run: npm run generate:rpc

      - name: Build TS host
        run: npm run build:server

      - name: Assemble private Node runtime
        run: node Script/Project/package_server.mjs

      - name: Build web application
        run: npm --prefix frontend/web run build

      - name: Build Windows pointer observer
        run: npm --prefix frontend run build:pointer-observer:win

      - name: Assemble Electron desktop
        run: node frontend/Script/Project/package_desktop.mjs win32 x64

      - name: Verify output
        shell: pwsh
        run: |
          $app = "frontend/dist/app/eden-agent-win32-x64"
          if (!(Test-Path "$app/eden-agent.exe")) { throw "缺少 eden-agent.exe" }
          if (!(Test-Path "$app/resources/node/node.exe")) { throw "缺少私有 Node 运行时" }
          if (!(Test-Path "$app/resources/runtime-manifest.json")) { throw "缺少运行时清单" }
          if (!(Test-Path "$app/resources/edenagent-pointer-observer.exe")) { throw "缺少指针观察器" }
          $size = (Get-ChildItem $app -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("Output: {0:N1} MB" -f $size)

      - name: Archive portable package
        shell: pwsh
        run: |
          $app = "frontend/dist/app/eden-agent-win32-x64"
          $out = "eden-agent-portable-win32-x64.zip"
          7z a -tzip -mx=5 $out "$app\*" | Out-Null
          Get-Item $out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: eden-agent-portable-win32-x64
          path: eden-agent-portable-win32-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "portable-${{ github.run_number }}"
          $asset = "eden-agent-portable-win32-x64.zip"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --title "Portable ${{ github.run_number }}" --notes "Windows x64 portable build"
          } else {
            gh release upload $tag $asset --clobber
          }
          Write-Host "Download: https://github.com/${{ github.repository }}/releases/download/$tag/$asset"
